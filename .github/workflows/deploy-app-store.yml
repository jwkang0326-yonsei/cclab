name: App Store Deploy (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy_android:
    name: Deploy Android to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          mkdir -p app/android/app
          if echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | grep -q "="; then
            echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          else
            echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > app/android/app/upload-keystore.jks
          fi
          
      - name: Decode Play Store JSON Key
        run: |
          if echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | grep -q "{"; then
            echo '${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}' > app/android/service-account.json
          else
            echo -n "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 --decode > app/android/service-account.json
          fi

      - name: Build App Bundle (AAB)
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
        run: |
          cd app
          flutter pub get
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/android

      - name: Upload to Play Store
        working-directory: app/android
        run: bundle exec fastlane internal

  deploy_ios:
    name: Deploy iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get
          cd ios
          pod install

      - name: Create iOS API Key file
        run: |
          # 불필요한 줄바꿈 및 공백 제거 로직 포함
          if echo "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" | grep -q "PRIVATE KEY"; then
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" > app/ios/api_key.p8
          else
            echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" | base64 --decode > app/ios/api_key.p8
          fi

      - name: Build Assets & iOS
        run: |
          cd app
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build ios --release --no-codesign \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Fastlane Beta (Certs & Upload)
        working-directory: app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CI: true
        run: bundle exec fastlane beta
