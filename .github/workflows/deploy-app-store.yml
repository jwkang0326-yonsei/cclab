name: App Store Deploy (Android & iOS)

on:
  push:
    tags:
      - 'v*' # v1.0.0+1 형식의 태그 푸시 시 실행
  workflow_dispatch: # 수동 실행 허용

jobs:
  deploy_android:
    name: Deploy Android to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/android

      # Keystore 복호화 (app/android/app/ 폴더에 저장)
      - name: Decode Keystore
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n ' | base64 --decode > app/android/app/upload-keystore.jks
          
      # Google Play Service Account JSON 복호화 (app/android/ 폴더에 저장)
      - name: Decode Play Store JSON Key
        run: |
          if echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | tr -d '\n ' | base64 --decode > app/android/service-account.json 2>/dev/null; then
            echo "✅ Google Play JSON Key decoded from Base64"
          else
            echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" > app/android/service-account.json
            echo "✅ Google Play JSON Key written as raw JSON"
          fi

      - name: Build App Bundle (AAB)
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
        run: |
          cd app
          flutter pub get
          # Generate version based on tag and current timestamp for build number
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Upload to Play Store
        working-directory: app/android
        run: bundle exec fastlane internal

  deploy_ios:
    name: Deploy iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get
          cd ios
          pod install

      - name: Build Assets & iOS
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          cd app
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build ios --release --no-codesign \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      # iOS API Key 파일 생성 (문자열 형식 에러 방지용)
      - name: Create iOS API Key file
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" > app/ios/api_key.p8 && echo "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" > app/ios/fastlane/api_key.p8

      - name: Fastlane Beta (Certs & Upload)
        working-directory: app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CI: true
        run: bundle exec fastlane beta
