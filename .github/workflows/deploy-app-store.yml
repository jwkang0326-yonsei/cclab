name: App Store Deploy (Android & iOS)

on:
  push:
    tags:
      - 'v*' # v1.0.0+1 형식의 태그 푸시 시 실행
  workflow_dispatch: # 수동 실행 허용

jobs:
  deploy_android:
    name: Deploy Android to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Keystore 복호화
      - name: Decode Keystore
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          
      # Google Play Service Account JSON 복구
      - name: Create and Verify Service Account JSON
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          # Fastfile이 fastlane/ 디렉토리에서 파일을 찾으므로 여기에 생성
          mkdir -p app/android/fastlane
          if [ -z "$PLAY_STORE_JSON" ]; then
            echo "❌ PLAY_STORE_JSON_KEY_BASE64 secret is empty!"
            exit 1
          fi
          # 1차: 원본 그대로 JSON인지 시도
          echo "$PLAY_STORE_JSON" > app/android/fastlane/service-account.json
          if python3 -m json.tool app/android/fastlane/service-account.json > /dev/null 2>&1; then
            echo "✅ Raw JSON detected"
          else
            # 2차: Base64 디코딩 시도
            echo -n "$PLAY_STORE_JSON" | base64 --decode > app/android/fastlane/service-account.json 2>/dev/null
            if python3 -m json.tool app/android/fastlane/service-account.json > /dev/null 2>&1; then
              echo "✅ Base64 decoded"
            else
              echo "❌ Secret is neither valid JSON nor valid Base64-encoded JSON"
              exit 1
            fi
          fi
          echo "✅ service-account.json created at app/android/fastlane/"
          echo "📄 Size: $(wc -c < app/android/fastlane/service-account.json) bytes"

      - name: Build App Bundle (AAB)
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "upload"
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
        run: |
          cd app
          flutter pub get
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Setup Ruby & Update Plugins
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/android

      - name: Debug - List Files
        run: |
          echo "📂 Current directory: $(pwd)"
          echo "🔍 Listing files in app/android/fastlane/:"
          ls -R app/android/fastlane/ || echo "❌ app/android/fastlane/ not found"

      - name: Upload to Play Store
        working-directory: app/android
        run: |
          bundle install
          bundle exec fastlane update_plugins
          bundle exec fastlane internal

  deploy_ios:
    name: Deploy iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get
          cd ios
          pod install

      # iOS API Key 파일 생성 및 검증
      - name: Create and Verify iOS API Key file
        env:
          IOS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          # Fastfile이 fastlane/ 디렉토리에서 파일을 찾으므로 여기에 생성
          mkdir -p app/ios/fastlane
          if [ -z "$IOS_API_KEY" ]; then
            echo "❌ APP_STORE_CONNECT_API_KEY_KEY secret is empty!"
            echo "💡 cclab 레포의 Settings > Secrets에 등록되어 있는지 확인하세요"
            exit 1
          fi
          # PEM 형식인지 Base64인지 판별
          if echo "$IOS_API_KEY" | grep -q "PRIVATE KEY"; then
            echo "$IOS_API_KEY" > app/ios/fastlane/api_key.p8
          else
            echo -n "$IOS_API_KEY" | base64 --decode > app/ios/fastlane/api_key.p8
          fi
          # 유효성 검증
          if grep -q "PRIVATE KEY" app/ios/fastlane/api_key.p8; then
            echo "✅ api_key.p8 created at app/ios/fastlane/"
            echo "📄 Size: $(wc -c < app/ios/fastlane/api_key.p8) bytes"
          else
            echo "❌ ERROR: api_key.p8 does not seem to be a valid private key file!"
            exit 1
          fi

      - name: Build Assets & iOS
        run: |
          cd app
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build ios --release --no-codesign \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Debug - List Files
        run: |
          echo "📂 Current directory: $(pwd)"
          echo "🔍 Listing files in app/ios/fastlane/:"
          ls -R app/ios/fastlane/ || echo "❌ app/ios/fastlane/ not found"

      - name: Fastlane Beta (Certs & Upload)
        working-directory: app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          CI: true
        run: |
          bundle install
          bundle exec fastlane update_plugins
          bundle exec fastlane beta
