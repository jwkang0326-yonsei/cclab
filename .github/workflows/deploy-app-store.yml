name: App Store Deploy (Android & iOS)

on:
  push:
    tags:
      - 'v*' # v1.0.0+1 형식의 태그 푸시 시 실행
  workflow_dispatch: # 수동 실행 허용

jobs:
  deploy_android:
    name: Deploy Android to Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Keystore 복호화
      - name: Decode Keystore
        run: |
          mkdir -p app/android/app
          if echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | grep -q "="; then
            echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          else
            echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > app/android/app/upload-keystore.jks
          fi
          
      # Google Play Service Account JSON 복구 (실행 폴더로 직접 이동 후 생성)
      - name: Create Service Account JSON
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          cd app/android
          if echo "$PLAY_STORE_JSON" | grep -q "{"; then
            echo "$PLAY_STORE_JSON" > service-account.json
          else
            echo "$PLAY_STORE_JSON" | base64 --decode > service-account.json
          fi

      - name: Build App Bundle (AAB)
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
        run: |
          cd app
          flutter pub get
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Setup Ruby & Update Plugins
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/android

      - name: Upload to Play Store
        working-directory: app/android
        run: |
          bundle install
          bundle exec fastlane update_plugins
          bundle exec fastlane internal

  deploy_ios:
    name: Deploy iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get
          cd ios
          pod install

      # iOS API Key 파일 생성 (실행 폴더인 app/ios 내부에서 직접 생성)
      - name: Create iOS API Key file
        env:
          IOS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          cd app/ios
          if echo "$IOS_API_KEY" | grep -q "PRIVATE KEY"; then
            echo "$IOS_API_KEY" > api_key.p8
          else
            echo "$IOS_API_KEY" | base64 --decode > api_key.p8
          fi

      - name: Build Assets & iOS
        run: |
          cd app
          TAG_NAME=${GITHUB_REF_NAME#v}
          BUILD_NAME=$(echo $TAG_NAME | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s)
          flutter build ios --release --no-codesign \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER

      - name: Fastlane Beta (Certs & Upload)
        working-directory: app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          CI: true
        run: |
          bundle install
          bundle exec fastlane update_plugins
          bundle exec fastlane beta
